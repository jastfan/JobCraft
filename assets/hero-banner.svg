<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glowCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
    .title-white { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-weight: 800; font-size: 64px; fill: #ffffff; letter-spacing: -1.5px; }
    .title-grad { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-weight: 800; font-size: 64px; fill: url(#brandGrad); letter-spacing: -1.5px; }
    .subtitle { font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; font-weight: 500; font-size: 21px; fill: #94a3b8; letter-spacing: -0.2px; }
    .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; fill: #38bdf8; }
    .badge-rect { fill: rgba(56, 189, 248, 0.08); stroke: rgba(56, 189, 248, 0.25); stroke-width: 1.5; rx: 8; }
    .pill-text { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 600; fill: #cbd5e1; }
    .domain-text { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; fill: #a855f7; }
  </style>

  <!-- Dark Background Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" rx="16" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Glowing Radial Light Orbs -->
  <circle cx="200" cy="190" r="180" fill="url(#glowCircle)" filter="url(#blurFilter)"/>
  <circle cx="1000" cy="90" r="140" fill="#a855f7" opacity="0.12" filter="url(#blurFilter)"/>

  <!-- Subtle Perspective Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="95" x2="1200" y2="95"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
    <line x1="0" y1="285" x2="1200" y2="285"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="400" y1="0" x2="400" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="800" y1="0" x2="800" y2="380"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
  </g>

  <!-- Brand Emblem (Left) -->
  <g transform="translate(100, 75)" filter="url(#logoGlow)">
    <polygon points="115,10 205,58 205,172 115,220 25,172 25,58" fill="#13192e" stroke="url(#brandGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M115 32 L168 74 L140 92 L115 67 L90 92 L62 74 Z" fill="url(#brandGrad)"/>
    <path d="M115 78 L178 126 L150 142 L115 113 L80 142 L52 126 Z" fill="url(#brandGrad)" opacity="0.85"/>
    <path d="M115 124 L160 162 L115 196 L70 162 Z" fill="url(#brandGrad)" opacity="0.95"/>
    <polygon points="115,107 125,120 115,133 105,120" fill="#ffffff"/>
  </g>

  <!-- Typography Content (Right) -->
  <g transform="translate(360, 115)">
    <!-- Category Pill -->
    <rect x="0" y="-38" width="168" height="28" class="badge-rect"/>
    <text x="14" y="-20" class="badge-text">⚡ v2.0 PRODUCTION</text>

    <rect x="180" y="-38" width="260" height="28" fill="rgba(168, 85, 247, 0.1)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5" rx="8"/>
    <text x="194" y="-20" class="domain-text">🛡️ ZERO-DB &amp; PRIVACY FIRST</text>

    <!-- Main Title -->
    <text x="0" y="42">
      <tspan class="title-white">Job</tspan><tspan class="title-grad">Craft</tspan>
      <tspan dx="15" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#38bdf8">.AI</tspan>
    </text>

    <!-- Subtitle / Value Prop -->
    <text x="0" y="85" class="subtitle">Autonomous AI Career Engine, Job Radar &amp; Application Studio</text>

    <!-- Feature Highlights Row -->
    <g transform="translate(0, 125)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="18" y="23" class="pill-text">🛰️ Live Radar</text>

      <!-- Pill 2 -->
      <rect x="157" y="0" width="165" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="175" y="23" class="pill-text">✍️ ATS CV Tailor</text>

      <!-- Pill 3 -->
      <rect x="334" y="0" width="160" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="352" y="23" class="pill-text">🎙️ Interview AI</text>

      <!-- Pill 4 -->
      <rect x="506" y="0" width="195" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)"/>
      <text x="524" y="23" class="pill-text">🧩 Chrome MV3 Ext</text>
    </g>
  </g>
</svg>
